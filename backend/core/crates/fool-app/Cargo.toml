[package]
name = "fool-app"
version.workspace = true
edition.workspace = true
exclude = ["data/**"]

[[bin]]
name = "foolcore"
path = "src/main.rs"

[features]
default = ["telegram", "lark", "dingtalk", "weixin"]
telegram = ["fool-channel/telegram"]
lark = ["fool-channel/lark"]
dingtalk = ["fool-channel/dingtalk"]
weixin = ["fool-channel/weixin"]

[dependencies]
fool-common.workspace = true
fool-assets.workspace = true
fool-db.workspace = true
fool-api-types.workspace = true
fool-realtime.workspace = true
fool-auth.workspace = true
fool-system.workspace = true
fool-file.workspace = true
fool-office.workspace = true
fool-shell.workspace = true
fool-ai-agent.workspace = true
fool-session.workspace = true
fool-mcp.workspace = true
fool-conversation.workspace = true
fool-extension.workspace = true
fool-channel.workspace = true
fool-team.workspace = true
fool-team-prompts.workspace = true
fool-cron.workspace = true
fool-project.workspace = true
fool-kanban.workspace = true
fool-assistant.workspace = true
fool-runtime.workspace = true
fool-process.workspace = true
foolrs-config.workspace = true
axum.workspace = true
chrono.workspace = true
dirs.workspace = true
tokio.workspace = true
uuid.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
rmcp = { version = "1.5", features = ["server", "transport-io", "schemars"] }
anyhow.workspace = true
async-trait.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
fool-api-types.workspace = true
fool-realtime.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
fool-ai-agent = { workspace = true, features = ["test-support"] }
base64.workspace = true
git2.workspace = true
http-body-util.workspace = true
rust_xlsxwriter.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
wiremock = "0.6"
