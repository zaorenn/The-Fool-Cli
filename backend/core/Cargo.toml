[workspace]
resolver = "3"
members = [
  "crates/fool-assets",
  "crates/fool-common",
  "crates/fool-db",
  "crates/fool-api-types",
  "crates/fool-realtime",
  "crates/fool-runtime",
  "crates/fool-process",
  "crates/fool-session",
  "crates/fool-auth",
  "crates/fool-system",
  "crates/fool-file",
  "crates/fool-office",
  "crates/fool-shell",
  "crates/fool-ai-agent",
  "crates/fool-mcp",
  "crates/fool-mcp-server",
  "crates/fool-app-tools",
  "crates/fool-conversation",
  "crates/fool-extension",
  "crates/fool-channel",
  "crates/fool-team-prompts",
  "crates/fool-team",
  "crates/fool-project",
  "crates/fool-kanban",
  "crates/fool-cron",
  "crates/fool-assistant",
  "crates/fool-app",
]

[workspace.package]
version = "0.1.54"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
fool-common = { path = "crates/fool-common" }
fool-assets = { path = "crates/fool-assets" }
fool-db = { path = "crates/fool-db" }
fool-api-types = { path = "crates/fool-api-types" }
fool-realtime = { path = "crates/fool-realtime" }
fool-runtime = { path = "crates/fool-runtime" }
fool-process = { path = "crates/fool-process" }
fool-session = { path = "crates/fool-session" }
fool-auth = { path = "crates/fool-auth" }
fool-system = { path = "crates/fool-system" }
fool-file = { path = "crates/fool-file" }
fool-office = { path = "crates/fool-office" }
fool-shell = { path = "crates/fool-shell" }
fool-ai-agent = { path = "crates/fool-ai-agent" }
fool-mcp = { path = "crates/fool-mcp" }
fool-mcp-server = { path = "crates/fool-mcp-server" }
fool-app-tools = { path = "crates/fool-app-tools" }
fool-conversation = { path = "crates/fool-conversation" }
fool-extension = { path = "crates/fool-extension" }
fool-channel = { path = "crates/fool-channel" }
fool-team-prompts = { path = "crates/fool-team-prompts" }
fool-team = { path = "crates/fool-team" }
fool-project = { path = "crates/fool-project" }
fool-kanban = { path = "crates/fool-kanban" }
fool-cron = { path = "crates/fool-cron" }
fool-assistant = { path = "crates/fool-assistant" }
fool-app = { path = "crates/fool-app" }

foolrs-agent = { path = "../agent/crates/foolrs-agent" }
foolrs-providers = { path = "../agent/crates/foolrs-providers" }
foolrs-types = { path = "../agent/crates/foolrs-types" }
foolrs-protocol = { path = "../agent/crates/foolrs-protocol" }
foolrs-config = { path = "../agent/crates/foolrs-config" }
foolrs-mcp = { path = "../agent/crates/foolrs-mcp" }

# Core framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
http = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async utilities
futures-util = "0.3"

# Async trait (dyn-compatible async traits)
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Auth / Crypto
jsonwebtoken = "9"
bcrypt = "0.17"
aes-gcm = "0.10"

# UUID
uuid = { version = "1", features = ["v7"] }
url = "2"

# HTTP client — use rustls with native roots to align backend trust with the host system.
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls-native-roots"], default-features = false }

# Concurrency
dashmap = "6"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# Protobuf
prost = "0.13"

# Semver
semver = "1"

# Directories
dirs = "6"

# Regex
regex = "1"

# File system
include_dir = "0.7"
notify = "8"
walkdir = "2"
ignore = "0.4"
zip = "2"
git2 = { version = "0.20", default-features = false }
mime_guess = "2"
rust-embed = "8"

# Runtime embedding
fs2 = "0.4"
zstd = "0.13"

# Cron
cron = "0.15"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Shell
open = "5"
which = "7"

# Office
calamine = "0.36"
rust_xlsxwriter = "0.82"
sha1 = "0.10"
sha2 = "0.10"

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrock = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

# TLS
rustls = "0.23"
rustls-native-certs = "0.8"

# Pin rustls-webpki to fix RUSTSEC-2026-{0098,0099,0104}
rustls-webpki = "0.103.13"

# OAuth / MCP
oauth2 = "5.0.0-rc.1"
toml = "0.8"

# Ed25519
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Encoding
base64 = "0.22"

# HTTP body utilities (testing)
http-body-util = "0.1"

# Testing
tempfile = "3"
wiremock = "0.6"
proptest = "1"

# Random
getrandom = "0.2"
hex = "0.4"
libc = "0.2"

# Shrink target/debug: minimal debuginfo, sidecar files, no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
