<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Voice states</title>
    <style>
      body {
        background: #0b0d10;
        color: #f5f1e8;
        font: 12px system-ui;
        margin: 0;
        padding: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      figure {
        margin: 0;
        background: #16181d;
        border-radius: 8px;
        padding: 4px;
      }
      .frame {
        overflow: hidden;
        aspect-ratio: 1;
      }
      img {
        width: 100%;
        height: 100%;
        display: block;
        transform: scale(2.4);
        transform-origin: 50% 48%;
      }
      figcaption {
        text-align: center;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="g"></div>
    <script>
      const s = ['voice-listening', 'voice-thinking', 'voice-speaking'];
      g.innerHTML = s
        .map(
          (n) =>
            `<figure><div class="frame"><img src="pet-states/${n}.svg?v=${Date.now()}"></div><figcaption>${n}</figcaption></figure>`
        )
        .join('');
    </script>
  </body>
</html>
