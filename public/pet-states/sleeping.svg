<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* ==PET-CORE== */
      /* Anchor transforms at each shape's own box so the numbers read as intent
         rather than as viewBox arithmetic. */
      .pet-body,
      .pet-head,
      .pet-hat,
      .pet-eye,
      .pet-pupil,
      .pet-lid,
      .pet-shadow,
      .pet-arm-l,
      .pet-arm-r {
        transform-box: fill-box;
      }

      /* Breath scales from the feet, never from the centre. */
      .pet-body {
        transform-origin: 50% 100%;
        animation: pet-breathe 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      /* A slow lean, offset from the breath so the two never sync up. */
      .pet-lean {
        animation: pet-sway 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }

      /* The head is carried, it does not drive: it follows a beat late. */
      .pet-head {
        transform-origin: 50% 100%;
        animation: pet-bob 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: 0.22s;
      }

      /* The bells trail further behind again. */
      .pet-hat {
        transform-origin: 50% 100%;
        animation: pet-hat-swing 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.38s;
      }

      /* The lid is the blink. In its own group so the pupil underneath can go on
         tracking the cursor while the eye is shut. */
      .pet-lid {
        transform-origin: 50% 0%;
        animation: pet-blink 4.3s cubic-bezier(0.3, 0, 0.2, 1) infinite;
      }

      /* Involuntary flicks between rests, as eyes actually move. */
      .pet-saccade {
        transform-origin: 50% 50%;
        animation: pet-saccade 11s steps(1, end) infinite;
      }

      .pet-shine {
        animation: pet-shine 4.3s ease-in-out infinite;
      }

      /* Tied to the breath, so contact with the ground stays believable. */
      .pet-shadow {
        transform-origin: 50% 50%;
        animation: pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .pet-arm-l {
        transform-origin: 100% 0%;
        animation: pet-arm-l 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.3s;
      }

      .pet-arm-r {
        transform-origin: 0% 0%;
        animation: pet-arm-r 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.46s;
      }

      /* The rise is quicker than the fall, like a real breath. */
      @keyframes pet-breathe {
        0% { transform: scale(1, 1) translateY(0); }
        38% { transform: scale(0.988, 1.014) translateY(-0.16px); }
        100% { transform: scale(1, 1) translateY(0); }
      }

      @keyframes pet-sway {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        27% { transform: rotate(1.15deg) translateX(0.1px); }
        52% { transform: rotate(0.1deg) translateX(0); }
        78% { transform: rotate(-1.15deg) translateX(-0.1px); }
      }

      @keyframes pet-bob {
        0% { transform: translateY(0) rotate(0deg); }
        38% { transform: translateY(-0.22px) rotate(-0.5deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      @keyframes pet-hat-swing {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(3.4deg); }
        55% { transform: rotate(-0.6deg); }
        80% { transform: rotate(-3.4deg); }
      }

      /* Down fast, up slower, then a second flick: the shape of a real blink
         rather than an on/off frame. */
      @keyframes pet-blink {
        0%, 88% { transform: scaleY(0); }
        90.5% { transform: scaleY(1); }
        93% { transform: scaleY(0.08); }
        95.5% { transform: scaleY(1); }
        98% { transform: scaleY(0); }
      }

      @keyframes pet-saccade {
        0%, 34% { transform: translate(0, 0); }
        36%, 55% { transform: translate(0.42px, -0.12px); }
        57%, 72% { transform: translate(-0.36px, 0.08px); }
        74%, 100% { transform: translate(0, 0); }
      }

      @keyframes pet-shine {
        0%, 100% { transform: translate(0, 0); opacity: 0.9; }
        45% { transform: translate(0.12px, 0.06px); opacity: 0.72; }
      }

      @keyframes pet-shadow {
        0% { transform: scaleX(1); opacity: 0.34; }
        38% { transform: scaleX(0.955); opacity: 0.26; }
        100% { transform: scaleX(1); opacity: 0.34; }
      }

      @keyframes pet-arm-l {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(-5deg); }
        78% { transform: rotate(4deg); }
      }

      @keyframes pet-arm-r {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(5deg); }
        78% { transform: rotate(-4deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pet-body,
        .pet-lean,
        .pet-head,
        .pet-hat,
        .pet-lid,
        .pet-saccade,
        .pet-shine,
        .pet-shadow,
        .pet-arm-l,
        .pet-arm-r {
          animation: none;
        }
      }
      /* ==/PET-CORE== */

      .sleep-body {
        transform-origin: 11px 15px;
        animation: sleep-breathe 4s ease-in-out infinite;
      }
      .pet-shadow {
        transform-origin: 11px 17.5px;
        animation:pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite, pet-shadow-pulse 4s ease-in-out infinite;
      }
      .sleep-z1 { animation: sleep-zzz1 5s ease-in-out infinite; animation-delay: 0s; opacity: 0; }
      .sleep-z2 { animation: sleep-zzz2 5s ease-in-out infinite; animation-delay: 1.6s; opacity: 0; }
      .sleep-z3 { animation: sleep-zzz3 5s ease-in-out infinite; animation-delay: 3.2s; opacity: 0; }
      @keyframes sleep-breathe {
        0%,100% { transform: scaleY(1) scaleX(1); }
        40%,60% { transform: scaleY(1.14) scaleX(0.94); }
      }
      @keyframes sleeping-shadow-pulse {
        0%,100% { transform: scaleX(1); opacity: 0.35; }
        40%,60% { transform: scaleX(1.08); opacity: 0.28; }
      }
      @keyframes sleep-zzz1 {
        0%   { opacity:0; transform: translate(14px,4px) scale(0.5); }
        15%  { opacity:0.9; }
        80%  { opacity:0.5; }
        100% { opacity:0; transform: translate(18px,-4px) scale(0.9); }
      }
      @keyframes sleep-zzz2 {
        0%   { opacity:0; transform: translate(16px,2px) scale(0.4); }
        15%  { opacity:0.85; }
        80%  { opacity:0.45; }
        100% { opacity:0; transform: translate(21px,-6px) scale(0.8); }
      }
      @keyframes sleep-zzz3 {
        0%   { opacity:0; transform: translate(12px,6px) scale(0.35); }
        15%  { opacity:0.8; }
        80%  { opacity:0.4; }
        100% { opacity:0; transform: translate(16px,-2px) scale(0.7); }
      }
    </style>
    <!-- pixel Z shape -->
    <g id="sleep-pz">
      <rect x="0" y="0" width="3" height="0.7"/>
      <rect x="1.6" y="0.7" width="0.8" height="0.8"/>
      <rect x="0.7" y="1.5" width="0.8" height="0.8"/>
      <rect x="0" y="2.3" width="3" height="0.7"/>
    </g>
  </defs>
  <!-- floating zzz -->
  <use href="#sleep-pz" class="sleep-z1" fill="#c4123f"/>
  <use href="#sleep-pz" class="sleep-z2" fill="#a0a8c8"/>
  <use href="#sleep-pz" class="sleep-z3" fill="#c0c8e0"/>

  <!-- shadow -->
  <ellipse class="pet-shadow" cx="11" cy="17.5" rx="4" ry="0.6" fill="#c0c0c0"/>

  <g class="sleep-body pet-body">
    <!-- 左手（大灰色，偏下） -->
    <rect x="2" y="14" width="3" height="3" rx="1.5" fill="#f5f1e8" fill-opacity="0.7"/>
    <!-- 压扁的身体（宽扁椭圆） -->
    <rect x="3" y="7" width="16" height="10" rx="5" fill="#f5f1e8"/>
    <!-- 帽子（正三角，不歪） -->
    <g class="pet-hat" transform="translate(11.00 6.85) rotate(0.0)"><path d="M-0.38 -0.28 C-1.76 -1.55 -3.68 -2.22 -4.65 -4.33 C-4.17 -1.66 -3.20 0.55 -1.99 0.67 C-1.28 0.67 -0.70 0.33 -0.38 -0.28 Z" fill="#c4123f"/><path d="M0.38 -0.28 C1.76 -1.55 3.68 -2.22 4.65 -4.33 C4.17 -1.66 3.20 0.55 1.99 0.67 C1.28 0.67 0.70 0.33 0.38 -0.28 Z" fill="#c4123f"/><path d="M-1.86 0.55 C-1.28 -3.05 1.28 -3.05 1.86 0.55 Z" fill="#c4123f"/><path d="M0 -5.66 C-0.96 -4.00 -1.09 -1.11 -0.64 0.55 L0.64 0.55 C1.09 -1.11 0.96 -4.00 0 -5.66 Z" fill="#c4123f"/><circle cx="-4.81" cy="-4.44" r="0.94" fill="#c4123f"/><circle cx="4.81" cy="-4.44" r="0.94" fill="#c4123f"/><circle cx="0" cy="-6.22" r="0.85" fill="#c4123f"/></g>
      <rect x="10" y="3" width="1" height="1" fill="#981033"/>
    <!-- 底座 -->
    <rect x="2" y="17" width="18" height="1" rx="0.3" fill="#D9D9D9"/>
    <!-- 右手（浅色，偏右下） -->
    <path d="M16.3402 14.3464C17.0804 13.6028 18.2833 13.6 19.0269 14.3402C19.7705 15.0804 19.7733 16.2833 19.0331 17.0269C18.2929 17.7705 17.0901 17.7733 16.3464 17.0331C15.6028 16.2929 15.6 15.0901 16.3402 14.3464Z" fill="#B9C3EB"/>
    <!-- 闭眼横线 -->
    <path d="M8 11H11" stroke="black" stroke-linecap="round"/>
    <!-- scar — same spot on the face in every state: head centre + (2.15, -1).
         Matches the flat sleeping layer inside waking.svg. -->
    <path d="M13.15 8.95 C13.55 10.25 13.55 11.75 13.15 13.05 C12.85 11.75 12.85 10.25 13.15 8.95 Z" fill="#c4123f"/>
    <!-- 安详微笑 -->
    <path d="M7 13C8.85289 15.1176 12.1471 15.1176 14 13" stroke="black" stroke-linecap="round"/>
  </g>
</svg>
