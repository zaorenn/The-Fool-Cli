<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* ==PET-CORE== */
      /* Anchor transforms at each shape's own box so the numbers read as intent
         rather than as viewBox arithmetic. */
      .pet-body,
      .pet-head,
      .pet-hat,
      .pet-eye,
      .pet-pupil,
      .pet-lid,
      .pet-shadow,
      .pet-arm-l,
      .pet-arm-r {
        transform-box: fill-box;
      }

      /* Breath scales from the feet, never from the centre. */
      .pet-body {
        transform-origin: 50% 100%;
        animation: pet-breathe 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      /* A slow lean, offset from the breath so the two never sync up. */
      .pet-lean {
        animation: pet-sway 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }

      /* The head is carried, it does not drive: it follows a beat late. */
      .pet-head {
        transform-origin: 50% 100%;
        animation: pet-bob 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: 0.22s;
      }

      /* The bells trail further behind again. */
      .pet-hat {
        transform-origin: 50% 100%;
        animation: pet-hat-swing 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.38s;
      }

      /* The lid is the blink. In its own group so the pupil underneath can go on
         tracking the cursor while the eye is shut. */
      .pet-lid {
        transform-origin: 50% 0%;
        animation: pet-blink 4.3s cubic-bezier(0.3, 0, 0.2, 1) infinite;
      }

      /* Involuntary flicks between rests, as eyes actually move. */
      .pet-saccade {
        transform-origin: 50% 50%;
        animation: pet-saccade 11s steps(1, end) infinite;
      }

      .pet-shine {
        animation: pet-shine 4.3s ease-in-out infinite;
      }

      /* Tied to the breath, so contact with the ground stays believable. */
      .pet-shadow {
        transform-origin: 50% 50%;
        animation: pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .pet-arm-l {
        transform-origin: 100% 0%;
        animation: pet-arm-l 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.3s;
      }

      .pet-arm-r {
        transform-origin: 0% 0%;
        animation: pet-arm-r 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.46s;
      }

      /* The rise is quicker than the fall, like a real breath. */
      @keyframes pet-breathe {
        0% { transform: scale(1, 1) translateY(0); }
        38% { transform: scale(0.988, 1.014) translateY(-0.16px); }
        100% { transform: scale(1, 1) translateY(0); }
      }

      @keyframes pet-sway {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        27% { transform: rotate(1.15deg) translateX(0.1px); }
        52% { transform: rotate(0.1deg) translateX(0); }
        78% { transform: rotate(-1.15deg) translateX(-0.1px); }
      }

      @keyframes pet-bob {
        0% { transform: translateY(0) rotate(0deg); }
        38% { transform: translateY(-0.22px) rotate(-0.5deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      @keyframes pet-hat-swing {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(3.4deg); }
        55% { transform: rotate(-0.6deg); }
        80% { transform: rotate(-3.4deg); }
      }

      /* Down fast, up slower, then a second flick: the shape of a real blink
         rather than an on/off frame. */
      @keyframes pet-blink {
        0%, 88% { transform: scaleY(0); }
        90.5% { transform: scaleY(1); }
        93% { transform: scaleY(0.08); }
        95.5% { transform: scaleY(1); }
        98% { transform: scaleY(0); }
      }

      @keyframes pet-saccade {
        0%, 34% { transform: translate(0, 0); }
        36%, 55% { transform: translate(0.42px, -0.12px); }
        57%, 72% { transform: translate(-0.36px, 0.08px); }
        74%, 100% { transform: translate(0, 0); }
      }

      @keyframes pet-shine {
        0%, 100% { transform: translate(0, 0); opacity: 0.9; }
        45% { transform: translate(0.12px, 0.06px); opacity: 0.72; }
      }

      @keyframes pet-shadow {
        0% { transform: scaleX(1); opacity: 0.34; }
        38% { transform: scaleX(0.955); opacity: 0.26; }
        100% { transform: scaleX(1); opacity: 0.34; }
      }

      @keyframes pet-arm-l {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(-5deg); }
        78% { transform: rotate(4deg); }
      }

      @keyframes pet-arm-r {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(5deg); }
        78% { transform: rotate(-4deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pet-body,
        .pet-lean,
        .pet-head,
        .pet-hat,
        .pet-lid,
        .pet-saccade,
        .pet-shine,
        .pet-shadow,
        .pet-arm-l,
        .pet-arm-r {
          animation: none;
        }
      }
      /* ==/PET-CORE== */

      .think-body {
        transform-origin: 11px 12px;
        animation: think-breathe 3.2s ease-in-out infinite;
      }
      .pet-shadow {
        transform-origin: 14px 26.5px;
        animation:pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite, pet-shadow-pulse 3.2s ease-in-out infinite;
      }
      .think-bubble { animation: think-bubble-float 3s ease-in-out infinite; }
      .tpx1 { animation: think-dot 1.8s infinite 0s; }
      .tpx2 { animation: think-dot 1.8s infinite 0.35s; }
      .tpx3 { animation: think-dot 1.8s infinite 0.7s; }
      .tgl1 { animation: think-glow 2.5s ease-out infinite 0s;   opacity:0; }
      .tgl2 { animation: think-glow 2.5s ease-out infinite 0.8s; opacity:0; }
      .tgl3 { animation: think-glow 2.5s ease-out infinite 1.6s; opacity:0; }
      @keyframes think-breathe {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(0.5px); }
      }
      @keyframes think-bubble-float {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-0.6px); }
      }
      @keyframes think-dot {
        0%,10%  { opacity:0; transform:scale(0.5); }
        35%,70% { opacity:1; transform:scale(1); }
        100%    { opacity:0; transform:scale(0.5); }
      }
      @keyframes think-glow {
        0%   { opacity:0;   transform:translate(0,0)    scale(1); }
        25%  { opacity:0.9; transform:translate(0.5px,-1px) scale(1); }
        100% { opacity:0;   transform:translate(2px,-7px)  scale(1.4); }
      }
      @keyframes thinking-shadow-pulse {
        0%,100% { transform: scaleX(1); opacity: 0.35; }
        50%     { transform: scaleX(0.96); opacity: 0.28; }
      }
    </style>
  
    <clipPath id="thinking-head-clip">
      <rect x="8" y="11" width="12" height="12" rx="6"/>
    </clipPath>
    <clipPath id="thinking-eye-clip">
      <circle cx="14" cy="16" r="1.35"/>
    </clipPath>
  </defs>

  <!-- 完全使用设计稿原始坐标，不做任何偏移 -->

  <!-- 飘动光点动画 -->
  <rect class="tgl1" x="21" y="12" width="1.5" height="1.5" rx="0.3" fill="#94BDFF"/>
  <rect class="tgl2" x="20" y="8"  width="1.2" height="1.2" rx="0.2" fill="#94BDFF"/>
  <rect class="tgl3" x="5"  y="12" width="1.2" height="1.2" rx="0.2" fill="#94BDFF"/>

  <!-- shadow — 统一样式 -->
  <ellipse class="pet-shadow" cx="14" cy="26.5" rx="4" ry="0.6" fill="#c0c0c0"/>
  <!-- 去掉设计稿里的 D9D9D9 阴影条 -->

  <g class="think-body pet-body">
    <!-- 左手：设计稿原始 ellipse path -->
    <path d="M8.9418 18.0631C8.35737 17.476 7.40762 17.4738 6.82048 18.0582C6.23334 18.6426 6.23115 19.5924 6.81558 20.1795C7.40001 20.7667 8.34975 20.7689 8.93689 20.1844C9.52403 19.6 9.52623 18.6502 8.9418 18.0631Z" fill="#f5f1e8" fill-opacity="0.7"/>
    <!-- 身体：设计稿原始 rect -->
    <rect width="12" height="12" rx="6" transform="matrix(-1 0 0 1 20 11)" fill="#f5f1e8"/>
    <!-- 右手：设计稿原始 rect -->
    <rect width="3" height="3" rx="1.5" transform="matrix(4.37114e-08 1 1 -4.37114e-08 18 19)" fill="#B6BDD6"/>
    <!-- 帽子：设计稿原始三角 -->
    <g class="pet-hat" transform="translate(16.01 12.95) rotate(23.3)"><path d="M-0.38 -0.28 C-1.76 -1.55 -3.68 -2.22 -4.65 -4.33 C-4.17 -1.66 -3.20 0.55 -1.99 0.67 C-1.28 0.67 -0.70 0.33 -0.38 -0.28 Z" fill="#c4123f"/><path d="M0.38 -0.28 C1.76 -1.55 3.68 -2.22 4.65 -4.33 C4.17 -1.66 3.20 0.55 1.99 0.67 C1.28 0.67 0.70 0.33 0.38 -0.28 Z" fill="#c4123f"/><path d="M-1.86 0.55 C-1.28 -3.05 1.28 -3.05 1.86 0.55 Z" fill="#c4123f"/><path d="M0 -5.66 C-0.96 -4.00 -1.09 -1.11 -0.64 0.55 L0.64 0.55 C1.09 -1.11 0.96 -4.00 0 -5.66 Z" fill="#c4123f"/><circle cx="-4.81" cy="-4.44" r="0.94" fill="#c4123f"/><circle cx="4.81" cy="-4.44" r="0.94" fill="#c4123f"/><circle cx="0" cy="-6.22" r="0.85" fill="#c4123f"/></g>
      <rect x="16" y="10" width="1" height="1" fill="#981033"/>
    <!-- 白色眼睛块 -->
    <rect x="8" y="8" width="2" height="3" fill="white"/>
    <!-- 嘟嘴圆点 -->
    
    <g class="pet-eye" clip-path="url(#thinking-head-clip)">
      <g class="pet-pupil">
        <g class="pet-saccade">
          <g clip-path="url(#thinking-eye-clip)">
            <circle cx="14" cy="16" r="1.15" fill="#111827"/>
            <circle class="pet-shine" cx="13.62" cy="15.58" r="0.34" fill="#f5f1e8" opacity="0.9"/>
            <circle cx="14.42" cy="16.50" r="0.18" fill="#f5f1e8" opacity="0.35"/>
            <rect class="pet-lid" x="12.60" y="14.60" width="2.8" height="2.8" fill="#f5f1e8"/>
          </g>
          <!-- scar: just past the eye, and it rides with it -->
          <path d="M16.35 13.60 C16.85 14.90 16.80 17.10 16.30 18.40 C16.00 17.05 16.02 14.95 16.35 13.60 Z" fill="#c4123f"/>
          <path d="M16.00 14.55 L16.90 14.90" stroke="#981033" stroke-width="0.22" stroke-linecap="round" opacity="0.85"/>
          <path d="M16.00 17.20 L16.85 17.50" stroke="#981033" stroke-width="0.22" stroke-linecap="round" opacity="0.85"/>
        </g>
      </g>
    </g>
    <!-- 嘴弧 -->
    <path d="M13 18.5C12.1198 18.72 11.8162 19.8162 12.4577 20.4577L12.5 20.5" stroke="black" stroke-linecap="round"/>
  </g>

  <!-- 像素泡泡：设计稿原始 path，完全不改坐标 -->
  <g class="think-bubble">
    <path d="M12.083 2.91602H13V8.41602H12.083V9.33301H2.91699V8.41602H2V2.91602H2.91699V2H12.083V2.91602Z" fill="white"/>
    <rect class="tpx1" x="4" y="5.33301" width="1" height="1" fill="#605AFF"/>
    <rect class="tpx2" x="7" y="5.33301" width="1" height="1" fill="#605AFF"/>
    <rect class="tpx3" x="10" y="5.33301" width="1" height="1" fill="#605AFF"/>
  </g>
</svg>
