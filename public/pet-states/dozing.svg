<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
      /* ==PET-CORE== */
      /* Anchor transforms at each shape's own box so the numbers read as intent
         rather than as viewBox arithmetic. */
      .pet-body,
      .pet-head,
      .pet-hat,
      .pet-eye,
      .pet-pupil,
      .pet-lid,
      .pet-shadow,
      .pet-arm-l,
      .pet-arm-r {
        transform-box: fill-box;
      }

      /* Breath scales from the feet, never from the centre. */
      .pet-body {
        transform-origin: 50% 100%;
        animation: pet-breathe 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      /* A slow lean, offset from the breath so the two never sync up. */
      .pet-lean {
        animation: pet-sway 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }

      /* The head is carried, it does not drive: it follows a beat late. */
      .pet-head {
        transform-origin: 50% 100%;
        animation: pet-bob 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: 0.22s;
      }

      /* The bells trail further behind again. */
      .pet-hat {
        transform-origin: 50% 100%;
        animation: pet-hat-swing 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.38s;
      }

      /* The lid is the blink. In its own group so the pupil underneath can go on
         tracking the cursor while the eye is shut. */
      .pet-lid {
        transform-origin: 50% 0%;
        animation: pet-blink 4.3s cubic-bezier(0.3, 0, 0.2, 1) infinite;
      }

      /* Involuntary flicks between rests, as eyes actually move. */
      .pet-saccade {
        transform-origin: 50% 50%;
        animation: pet-saccade 11s steps(1, end) infinite;
      }

      .pet-shine {
        animation: pet-shine 4.3s ease-in-out infinite;
      }

      /* Tied to the breath, so contact with the ground stays believable. */
      .pet-shadow {
        transform-origin: 50% 50%;
        animation: pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .pet-arm-l {
        transform-origin: 100% 0%;
        animation: pet-arm-l 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.3s;
      }

      .pet-arm-r {
        transform-origin: 0% 0%;
        animation: pet-arm-r 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.46s;
      }

      /* The rise is quicker than the fall, like a real breath. */
      @keyframes pet-breathe {
        0% { transform: scale(1, 1) translateY(0); }
        38% { transform: scale(0.988, 1.014) translateY(-0.16px); }
        100% { transform: scale(1, 1) translateY(0); }
      }

      @keyframes pet-sway {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        27% { transform: rotate(1.15deg) translateX(0.1px); }
        52% { transform: rotate(0.1deg) translateX(0); }
        78% { transform: rotate(-1.15deg) translateX(-0.1px); }
      }

      @keyframes pet-bob {
        0% { transform: translateY(0) rotate(0deg); }
        38% { transform: translateY(-0.22px) rotate(-0.5deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      @keyframes pet-hat-swing {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(3.4deg); }
        55% { transform: rotate(-0.6deg); }
        80% { transform: rotate(-3.4deg); }
      }

      /* Down fast, up slower, then a second flick: the shape of a real blink
         rather than an on/off frame. */
      @keyframes pet-blink {
        0%, 88% { transform: scaleY(0); }
        90.5% { transform: scaleY(1); }
        93% { transform: scaleY(0.08); }
        95.5% { transform: scaleY(1); }
        98% { transform: scaleY(0); }
      }

      @keyframes pet-saccade {
        0%, 34% { transform: translate(0, 0); }
        36%, 55% { transform: translate(0.42px, -0.12px); }
        57%, 72% { transform: translate(-0.36px, 0.08px); }
        74%, 100% { transform: translate(0, 0); }
      }

      @keyframes pet-shine {
        0%, 100% { transform: translate(0, 0); opacity: 0.9; }
        45% { transform: translate(0.12px, 0.06px); opacity: 0.72; }
      }

      @keyframes pet-shadow {
        0% { transform: scaleX(1); opacity: 0.34; }
        38% { transform: scaleX(0.955); opacity: 0.26; }
        100% { transform: scaleX(1); opacity: 0.34; }
      }

      @keyframes pet-arm-l {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(-5deg); }
        78% { transform: rotate(4deg); }
      }

      @keyframes pet-arm-r {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(5deg); }
        78% { transform: rotate(-4deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pet-body,
        .pet-lean,
        .pet-head,
        .pet-hat,
        .pet-lid,
        .pet-saccade,
        .pet-shine,
        .pet-shadow,
        .pet-arm-l,
        .pet-arm-r {
          animation: none;
        }
      }
      /* ==/PET-CORE== */

    .pet-body { transform-origin:11px 18px; animation:pet-breathe 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite, doze-nod 2.5s ease-in-out infinite; }
    .pet-shadow { transform-origin:11px 22.5px; animation:pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite, dozing-shadow 2.5s ease-in-out infinite; }
    .doze-z1 { animation:doze-z 3.5s ease-in-out infinite; animation-delay:0s; opacity:0; }
    .doze-z2 { animation:doze-z 3.5s ease-in-out infinite; animation-delay:1.2s; opacity:0; }
    @keyframes doze-nod { 0%,100%{transform:rotate(0) translateY(0)} 40%{transform:rotate(5deg) translateY(2px)} 55%{transform:rotate(-3deg) translateY(-1px)} 70%{transform:rotate(3deg) translateY(1px)} }
    @keyframes dozing-shadow { 0%,100%{transform:scaleX(1);opacity:.3} 40%{transform:scaleX(1.05);opacity:.35} }
    @keyframes doze-z { 0%{opacity:0;transform:translate(14px,6px) scale(.4)} 20%{opacity:.7} 80%{opacity:.3} 100%{opacity:0;transform:translate(18px,-2px) scale(.8)} }
  </style>
  <g id="doze-pz"><rect x="0" y="0" width="2.5" height="0.6"/><rect x="1.3" y="0.6" width="0.7" height="0.7"/><rect x="0.5" y="1.3" width="0.7" height="0.7"/><rect x="0" y="2" width="2.5" height="0.6"/></g>
  </defs>
  <use href="#doze-pz" class="doze-z1" fill="#c4123f"/>
  <use href="#doze-pz" class="doze-z2" fill="#a0a8c8"/>
  <ellipse class="pet-shadow" cx="11" cy="22.5" rx="4" ry="0.6" fill="#c0c0c0"/>
  <g class="pet-body">
    <rect x="2" y="10" width="3" height="3" rx="0.5" fill="#c4123f" opacity="0.55" transform="rotate(45 3.5 11.5)"/>
    <rect x="17" y="10" width="3" height="3" rx="0.5" fill="#c4123f" opacity="0.55" transform="rotate(45 18.5 11.5)"/>
    <rect x="5" y="6" width="12" height="12" rx="6" fill="#9098b8"/>
    <g class="pet-hat" transform="translate(11.00 7.00) rotate(0.0)"><path d="M-0.48 -0.30 C-2.20 -1.68 -4.60 -2.40 -5.80 -4.68 C-5.20 -1.80 -4.00 0.60 -2.48 0.72 C-1.60 0.72 -0.88 0.36 -0.48 -0.30 Z" fill="#c4123f"/><path d="M0.48 -0.30 C2.20 -1.68 4.60 -2.40 5.80 -4.68 C5.20 -1.80 4.00 0.60 2.48 0.72 C1.60 0.72 0.88 0.36 0.48 -0.30 Z" fill="#c4123f"/><path d="M-2.32 0.60 C-1.60 -3.30 1.60 -3.30 2.32 0.60 Z" fill="#c4123f"/><path d="M0 -6.12 C-1.20 -4.32 -1.36 -1.20 -0.80 0.60 L0.80 0.60 C1.36 -1.20 1.20 -4.32 0 -6.12 Z" fill="#c4123f"/><circle cx="-6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="0" cy="-6.72" r="0.92" fill="#c4123f"/></g>
        <rect x="10" y="2" width="1" height="1" fill="#981033" transform="rotate(-10 11 5)"/>
    <!-- 半闭眼 -->
    <rect x="9" y="10.5" width="4" height="0.8" rx="0.4" fill="#111827"/>
    <!-- scar — same spot on the face in every state: head centre + (2.15, -1). -->
    <path d="M13.15 8.95 C13.55 10.25 13.55 11.75 13.15 13.05 C12.85 11.75 12.85 10.25 13.15 8.95 Z" fill="#c4123f"/>
    <!-- 小嘴 -->
    <path d="M9.5 13.5 Q11 14.5 12.5 13.5" stroke="#111827" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
