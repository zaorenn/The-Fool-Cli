<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
    .read-body { transform-origin:11px 12px; animation:read-tilt 5s ease-in-out infinite; }
    .read-shadow { transform-origin:11px 22.5px; animation:read-shadow 5s ease-in-out infinite; }
    .read-page { animation:read-flip 2.5s ease-in-out infinite; }
    @keyframes read-tilt { 0%,100%{transform:rotate(0) translateY(0)} 50%{transform:rotate(5deg) translateY(1px)} }
    @keyframes read-shadow { 0%,100%{transform:scaleX(1);opacity:.3} 50%{transform:scaleX(1.05);opacity:.35} }
    @keyframes read-flip { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(-1)} }
  </style></defs>
  <ellipse class="read-shadow" cx="11" cy="22.5" rx="4" ry="0.6" fill="#c0c0c0"/>
  <g class="read-body">
    <rect x="5" y="6" width="12" height="12" rx="6" fill="#f5f1e8"/>
    <g class="pet-hat" transform="translate(11.00 7.00) rotate(0.0)"><path d="M-0.48 -0.30 C-2.20 -1.68 -4.60 -2.40 -5.80 -4.68 C-5.20 -1.80 -4.00 0.60 -2.48 0.72 C-1.60 0.72 -0.88 0.36 -0.48 -0.30 Z" fill="#c4123f"/><path d="M0.48 -0.30 C2.20 -1.68 4.60 -2.40 5.80 -4.68 C5.20 -1.80 4.00 0.60 2.48 0.72 C1.60 0.72 0.88 0.36 0.48 -0.30 Z" fill="#c4123f"/><path d="M-2.32 0.60 C-1.60 -3.30 1.60 -3.30 2.32 0.60 Z" fill="#c4123f"/><path d="M0 -6.12 C-1.20 -4.32 -1.36 -1.20 -0.80 0.60 L0.80 0.60 C1.36 -1.20 1.20 -4.32 0 -6.12 Z" fill="#c4123f"/><circle cx="-6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="0" cy="-6.72" r="0.92" fill="#c4123f"/></g>
    <rect x="10" y="2" width="1" height="1" fill="#981033"/>
    <!-- 低头看（眼睛看下方） -->
    <rect x="10" y="11.5" width="2" height="1.5" rx="0.5" fill="#111827"/>
    <!-- scar — same spot on the face in every state: head centre + (2.15, -1). -->
    <path d="M13.15 8.95 C13.55 10.25 13.55 11.75 13.15 13.05 C12.85 11.75 12.85 10.25 13.15 8.95 Z" fill="#c4123f"/>
    <!-- 安静小嘴 -->
    <path d="M9.5 14.5 Q11 15.5 12.5 14.5" stroke="#111827" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 书本在手前 -->
    <rect x="4" y="14" width="3" height="3" rx="1.5" fill="#c4123f" opacity="0.7"/>
    <rect x="15" y="14" width="3" height="3" rx="1.5" fill="#c4123f" opacity="0.7"/>
    <!-- 打开的书 -->
    <rect x="6" y="16" width="4.5" height="5" rx="0.5" fill="#f0ece0"/>
    <rect x="11.5" y="16" width="4.5" height="5" rx="0.5" fill="#e8e4d8"/>
    <rect x="10.5" y="16" width="1" height="5.5" rx="0.3" fill="#d0c8b0"/>
    <!-- 书上文字 -->
    <rect x="7" y="17.5" width="3" height="0.5" rx="0.2" fill="#b0a890" opacity="0.7"/>
    <rect x="7" y="18.8" width="2" height="0.5" rx="0.2" fill="#b0a890" opacity="0.5"/>
    <g class="read-page"><rect x="12.5" y="17.5" width="2.5" height="0.5" rx="0.2" fill="#b0a890" opacity="0.7"/></g>
    <rect x="12.5" y="18.8" width="3" height="0.5" rx="0.2" fill="#b0a890" opacity="0.5"/>
  </g>
</svg>
