<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .idle-body {
        transform-origin: 11px 18px;
        animation: idle-breathe 3.2s ease-in-out infinite, idle-sway 6s ease-in-out infinite;
      }
      .idle-eye {
        transform-origin: 11px 11px;
        animation: idle-blink 4s ease-in-out infinite;
      }
      .idle-shadow {
        transform-origin: 11px 22.5px;
        animation: idle-shadow-pulse 3.2s ease-in-out infinite;
      }
      @keyframes idle-breathe {
        0%,100% { transform: scaleY(1) translateY(0); }
        50%     { transform: scaleY(0.97) translateY(0.3px); }
      }
      @keyframes idle-sway {
        0%,100% { transform: rotate(0deg); }
        25%     { transform: rotate(1.2deg); }
        75%     { transform: rotate(-1.2deg); }
      }
      @keyframes idle-blink {
        0%,8%,100% { transform: scaleY(1); }
        4%          { transform: scaleY(0.08); }
      }
      @keyframes idle-shadow-pulse {
        0%,100% { transform: scaleX(1); opacity: 0.35; }
        50%     { transform: scaleX(0.96); opacity: 0.28; }
      }
    </style>
  </defs>
  <!-- shadow -->
  <ellipse class="idle-shadow" cx="11" cy="22.5" rx="4" ry="0.6" fill="#c0c0c0"/>
  <!-- .idle-track — cursor-tracking wrapper; JS writes its SVG transform
       attribute here. Separate from .idle-body so the CSS breathe+sway
       animations keep running underneath without fighting the JS transform. -->
  <g class="idle-track">
    <!-- main body group -->
    <g class="idle-body">
      <!-- arms — relaxed diamonds -->
      <rect x="2" y="9" width="3" height="3" rx="0.5" fill="#c4123f" opacity="0.7" transform="rotate(45 3.5 10.5)"/>
      <rect x="17" y="9" width="3" height="3" rx="0.5" fill="#c4123f" opacity="0.7" transform="rotate(45 18.5 10.5)"/>
      <!-- body -->
      <rect x="5" y="6" width="12" height="12" rx="6" fill="#f5f1e8"/>
      <!-- hat -->
      <g class="pet-hat" transform="translate(11.00 7.00) rotate(0.0)"><path d="M-0.48 -0.30 C-2.20 -1.68 -4.60 -2.40 -5.80 -4.68 C-5.20 -1.80 -4.00 0.60 -2.48 0.72 C-1.60 0.72 -0.88 0.36 -0.48 -0.30 Z" fill="#c4123f"/><path d="M0.48 -0.30 C2.20 -1.68 4.60 -2.40 5.80 -4.68 C5.20 -1.80 4.00 0.60 2.48 0.72 C1.60 0.72 0.88 0.36 0.48 -0.30 Z" fill="#c4123f"/><path d="M-2.32 0.60 C-1.60 -3.30 1.60 -3.30 2.32 0.60 Z" fill="#c4123f"/><path d="M0 -6.12 C-1.20 -4.32 -1.36 -1.20 -0.80 0.60 L0.80 0.60 C1.36 -1.20 1.20 -4.32 0 -6.12 Z" fill="#c4123f"/><circle cx="-6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="0" cy="-6.72" r="0.92" fill="#c4123f"/></g>
      <!-- hat highlight -->
      <rect x="10" y="2" width="1" height="1" fill="#981033"/>
      <!-- eye (CSS blink) — .idle-pupil is the inner wrapper JS writes to for
           eye tracking, so the blink animation on .idle-eye stays isolated. -->
      <g class="idle-eye">
        <g class="idle-pupil">
          <circle cx="11.00" cy="11.00" r="1.05" fill="#111827"/><circle cx="10.66" cy="10.62" r="0.3" fill="#f5f1e8" opacity="0.9"/>
        </g>
      </g>
      <!-- scar — a mark on the face, so it stays outside .idle-eye (which
           blinks) and outside .idle-pupil (which follows the cursor). Inside
           either one it would squash shut or drift with the gaze. -->
      <path d="M13.15 8.95 C13.55 10.25 13.55 11.75 13.15 13.05 C12.85 11.75 12.85 10.25 13.15 8.95 Z" fill="#c4123f"/>
      <!-- smile -->
      <path d="M8 13.5 Q11 16.5 14 13.5" stroke="#111827" stroke-width="1" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
