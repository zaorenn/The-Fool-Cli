<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .err-body {
        animation: err-shake 0.38s ease-in-out infinite;
      }
      .err-hat {
        transform-origin: 11px 4px;
        animation: err-hat-fly 0.76s ease-in-out infinite;
      }
      .err-arm-l {
        transform-origin: 3.5px 10.5px;
        animation: err-arm-l 0.38s ease-in-out infinite;
      }
      .err-arm-r {
        transform-origin: 18.5px 10.5px;
        animation: err-arm-r 0.38s ease-in-out infinite;
      }
      .err-shadow {
        transform-origin: 11px 22.5px;
        animation: err-shadow-shake 0.38s ease-in-out infinite;
      }
      @keyframes err-shake {
        0%,100% { transform: translateX(0) rotate(0deg); }
        20%     { transform: translateX(-2px) rotate(-2.5deg); }
        40%     { transform: translateX(2px) rotate(2.5deg); }
        60%     { transform: translateX(-1.5px) rotate(-1.5deg); }
        80%     { transform: translateX(1.5px) rotate(1.5deg); }
      }
      @keyframes err-hat-fly {
        0%,100% { transform: translateX(0) translateY(0) rotate(0deg); }
        25%     { transform: translateX(3px) translateY(-5px) rotate(20deg); }
        50%     { transform: translateX(1px) translateY(-3px) rotate(10deg); }
        75%     { transform: translateX(-2px) translateY(-4px) rotate(-12deg); }
      }
      @keyframes err-arm-l {
        0%,100% { transform: rotate(0deg); }
        30%     { transform: rotate(-40deg); }
        70%     { transform: rotate(20deg); }
      }
      @keyframes err-arm-r {
        0%,100% { transform: rotate(0deg); }
        30%     { transform: rotate(40deg); }
        70%     { transform: rotate(-20deg); }
      }
      @keyframes err-shadow-shake {
        0%,100% { opacity: 0.35; }
        50%     { opacity: 0.2; }
      }
    </style>
  </defs>
  <ellipse class="err-shadow" cx="11" cy="22.5" rx="4" ry="0.6" fill="#c0c0c0"/>
  <!-- hat flying separately above body -->
  <g class="err-hat">
    <g class="pet-hat" transform="translate(11.00 7.00) rotate(0.0)"><path d="M-0.48 -0.30 C-2.20 -1.68 -4.60 -2.40 -5.80 -4.68 C-5.20 -1.80 -4.00 0.60 -2.48 0.72 C-1.60 0.72 -0.88 0.36 -0.48 -0.30 Z" fill="#c4123f"/><path d="M0.48 -0.30 C2.20 -1.68 4.60 -2.40 5.80 -4.68 C5.20 -1.80 4.00 0.60 2.48 0.72 C1.60 0.72 0.88 0.36 0.48 -0.30 Z" fill="#c4123f"/><path d="M-2.32 0.60 C-1.60 -3.30 1.60 -3.30 2.32 0.60 Z" fill="#c4123f"/><path d="M0 -6.12 C-1.20 -4.32 -1.36 -1.20 -0.80 0.60 L0.80 0.60 C1.36 -1.20 1.20 -4.32 0 -6.12 Z" fill="#c4123f"/><circle cx="-6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="0" cy="-6.72" r="0.92" fill="#c4123f"/></g>
    <rect x="10" y="2" width="1" height="1" fill="#981033"/>
  </g>
  <g class="err-body">
    <!-- flailing arms -->
    <g class="err-arm-l">
      <rect x="2" y="9" width="3" height="3" rx="0.5" fill="#c4123f" opacity="0.7" transform="rotate(45 3.5 10.5)"/>
    </g>
    <g class="err-arm-r">
      <rect x="17" y="9" width="3" height="3" rx="0.5" fill="#c4123f" opacity="0.7" transform="rotate(45 18.5 10.5)"/>
    </g>
    <!-- body with red tint hint -->
    <rect x="5" y="6" width="12" height="12" rx="6" fill="#a090b5"/>
    <!-- X eyes -->
    <line x1="9" y1="9.5" x2="11" y2="11.5" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="11" y1="9.5" x2="9" y2="11.5" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="11" y1="9.5" x2="13" y2="11.5" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="13" y1="9.5" x2="11" y2="11.5" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/>
    <!-- scar — same spot on the face in every state: head centre + (2.15, -1). -->
    <path d="M13.15 8.95 C13.55 10.25 13.55 11.75 13.15 13.05 C12.85 11.75 12.85 10.25 13.15 8.95 Z" fill="#c4123f"/>
    <!-- worried inverted arc mouth -->
    <path d="M8.5 14.5 Q11 12.5 13.5 14.5" stroke="#111827" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>
</svg>
