<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
    .carry-body { transform-origin:11px 18px; animation:carry-walk .6s ease-in-out infinite; }
    .carry-shadow { transform-origin:11px 22.5px; animation:carry-shadow .6s ease-in-out infinite; }
    .carry-box { transform-origin:11px 16px; animation:carry-box-bob .6s ease-in-out infinite; }
    @keyframes carry-walk { 0%,100%{transform:translateX(0) translateY(0) rotate(0)} 25%{transform:translateX(1px) translateY(-1.5px) rotate(2deg)} 75%{transform:translateX(-1px) translateY(-1.5px) rotate(-2deg)} }
    @keyframes carry-shadow { 0%,100%{transform:scaleX(1);opacity:.3} 25%,75%{transform:scaleX(.85);opacity:.2} }
    @keyframes carry-box-bob { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-.5px) rotate(1deg)} 75%{transform:translateY(-.5px) rotate(-1deg)} }
  </style></defs>
  <ellipse class="carry-shadow" cx="11" cy="22.5" rx="5" ry="0.6" fill="#c0c0c0"/>
  <g class="carry-body">
    <rect x="5" y="6" width="12" height="12" rx="6" fill="#f5f1e8"/>
    <g class="pet-hat" transform="translate(11.00 7.00) rotate(0.0)"><path d="M-0.48 -0.30 C-2.20 -1.68 -4.60 -2.40 -5.80 -4.68 C-5.20 -1.80 -4.00 0.60 -2.48 0.72 C-1.60 0.72 -0.88 0.36 -0.48 -0.30 Z" fill="#c4123f"/><path d="M0.48 -0.30 C2.20 -1.68 4.60 -2.40 5.80 -4.68 C5.20 -1.80 4.00 0.60 2.48 0.72 C1.60 0.72 0.88 0.36 0.48 -0.30 Z" fill="#c4123f"/><path d="M-2.32 0.60 C-1.60 -3.30 1.60 -3.30 2.32 0.60 Z" fill="#c4123f"/><path d="M0 -6.12 C-1.20 -4.32 -1.36 -1.20 -0.80 0.60 L0.80 0.60 C1.36 -1.20 1.20 -4.32 0 -6.12 Z" fill="#c4123f"/><circle cx="-6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="6.00" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="0" cy="-6.72" r="0.92" fill="#c4123f"/></g>
    <rect x="10" y="2" width="1" height="1" fill="#981033"/>
    <!-- 努力表情 -->
    <rect x="9" y="10.5" width="4" height="1" rx="0.5" fill="#111827"/>
    <!-- scar — same spot on the face in every state: head centre + (2.15, -1). -->
    <path d="M13.15 8.95 C13.55 10.25 13.55 11.75 13.15 13.05 C12.85 11.75 12.85 10.25 13.15 8.95 Z" fill="#c4123f"/>
    <path d="M9 14 Q11 12.5 13 14" stroke="#111827" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <!-- 箱子在身前 -->
    <g class="carry-box">
      <!-- 两手抱着箱子 -->
      <rect x="4" y="12" width="3" height="3" rx="1.5" fill="#c4123f" opacity="0.8"/>
      <rect x="15" y="12" width="3" height="3" rx="1.5" fill="#c4123f" opacity="0.8"/>
      <!-- 箱子 -->
      <rect x="6" y="14" width="10" height="7" rx="1" fill="#c8a96e"/>
      <rect x="6" y="14" width="10" height="7" rx="1" fill="none" stroke="#a08040" stroke-width="0.5"/>
      <!-- 箱子胶带 -->
      <rect x="10" y="14" width="2" height="7" rx="0.3" fill="#e0c070" opacity="0.7"/>
      <!-- 箱子高光 -->
      <rect x="7" y="15" width="3" height="0.7" rx="0.3" fill="white" opacity="0.3"/>
    </g>
  </g>
</svg>
