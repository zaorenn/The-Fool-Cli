<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* ==PET-CORE== */
      /* Anchor transforms at each shape's own box so the numbers read as intent
         rather than as viewBox arithmetic. */
      .pet-body,
      .pet-head,
      .pet-hat,
      .pet-eye,
      .pet-pupil,
      .pet-lid,
      .pet-shadow,
      .pet-arm-l,
      .pet-arm-r {
        transform-box: fill-box;
      }

      /* Breath scales from the feet, never from the centre. */
      .pet-body {
        transform-origin: 50% 100%;
        animation: pet-breathe 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      /* A slow lean, offset from the breath so the two never sync up. */
      .pet-lean {
        animation: pet-sway 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }

      /* The head is carried, it does not drive: it follows a beat late. */
      .pet-head {
        transform-origin: 50% 100%;
        animation: pet-bob 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: 0.22s;
      }

      /* The bells trail further behind again. */
      .pet-hat {
        transform-origin: 50% 100%;
        animation: pet-hat-swing 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.38s;
      }

      /* The lid is the blink. In its own group so the pupil underneath can go on
         tracking the cursor while the eye is shut. */
      .pet-lid {
        transform-origin: 50% 0%;
        animation: pet-blink 4.3s cubic-bezier(0.3, 0, 0.2, 1) infinite;
      }

      /* Involuntary flicks between rests, as eyes actually move. */
      .pet-saccade {
        transform-origin: 50% 50%;
        animation: pet-saccade 11s steps(1, end) infinite;
      }

      .pet-shine {
        animation: pet-shine 4.3s ease-in-out infinite;
      }

      /* Tied to the breath, so contact with the ground stays believable. */
      .pet-shadow {
        transform-origin: 50% 50%;
        animation: pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .pet-arm-l {
        transform-origin: 100% 0%;
        animation: pet-arm-l 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.3s;
      }

      .pet-arm-r {
        transform-origin: 0% 0%;
        animation: pet-arm-r 6.1s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        animation-delay: 0.46s;
      }

      /* The rise is quicker than the fall, like a real breath. */
      @keyframes pet-breathe {
        0% { transform: scale(1, 1) translateY(0); }
        38% { transform: scale(0.988, 1.014) translateY(-0.16px); }
        100% { transform: scale(1, 1) translateY(0); }
      }

      @keyframes pet-sway {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        27% { transform: rotate(1.15deg) translateX(0.1px); }
        52% { transform: rotate(0.1deg) translateX(0); }
        78% { transform: rotate(-1.15deg) translateX(-0.1px); }
      }

      @keyframes pet-bob {
        0% { transform: translateY(0) rotate(0deg); }
        38% { transform: translateY(-0.22px) rotate(-0.5deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      @keyframes pet-hat-swing {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(3.4deg); }
        55% { transform: rotate(-0.6deg); }
        80% { transform: rotate(-3.4deg); }
      }

      /* Down fast, up slower, then a second flick: the shape of a real blink
         rather than an on/off frame. */
      @keyframes pet-blink {
        0%, 88% { transform: scaleY(0); }
        90.5% { transform: scaleY(1); }
        93% { transform: scaleY(0.08); }
        95.5% { transform: scaleY(1); }
        98% { transform: scaleY(0); }
      }

      @keyframes pet-saccade {
        0%, 34% { transform: translate(0, 0); }
        36%, 55% { transform: translate(0.42px, -0.12px); }
        57%, 72% { transform: translate(-0.36px, 0.08px); }
        74%, 100% { transform: translate(0, 0); }
      }

      @keyframes pet-shine {
        0%, 100% { transform: translate(0, 0); opacity: 0.9; }
        45% { transform: translate(0.12px, 0.06px); opacity: 0.72; }
      }

      @keyframes pet-shadow {
        0% { transform: scaleX(1); opacity: 0.34; }
        38% { transform: scaleX(0.955); opacity: 0.26; }
        100% { transform: scaleX(1); opacity: 0.34; }
      }

      @keyframes pet-arm-l {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(-5deg); }
        78% { transform: rotate(4deg); }
      }

      @keyframes pet-arm-r {
        0%, 100% { transform: rotate(0deg); }
        27% { transform: rotate(5deg); }
        78% { transform: rotate(-4deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pet-body,
        .pet-lean,
        .pet-head,
        .pet-hat,
        .pet-lid,
        .pet-saccade,
        .pet-shine,
        .pet-shadow,
        .pet-arm-l,
        .pet-arm-r {
          animation: none;
        }
      }
      /* ==/PET-CORE== */

      .wk-all {
        transform-origin: 12px 15px;
        animation: wk-bob 0.6s cubic-bezier(0.36,0.07,0.19,0.97) infinite;
      }
      .wk-hand-r {
        transform-origin: 14px 22px;
        animation: wk-tap-r 0.3s ease-in-out infinite alternate;
      }
      .wk-hand-l {
        transform-origin: 7px 22px;
        animation: wk-tap-l 0.3s ease-in-out infinite alternate;
      }
      .pet-shadow {
        transform-origin: 10px 23.5px;
        animation: pet-shadow 3.7s cubic-bezier(0.45, 0, 0.55, 1) infinite, working-shadow 2.4s ease-in-out infinite;
      }
      .wk-hat {
        transform-origin: 15px 8px;
        animation: wk-hat-shake 0.3s ease-in-out infinite alternate;
      }
      .wk-dot1 { animation: wk-dot-flash 0.9s ease-in-out infinite; animation-delay: 0s; }
      .wk-dot2 { animation: wk-dot-flash 0.9s ease-in-out infinite; animation-delay: 0.3s; }
      .wk-dot3 { animation: wk-dot-flash 0.9s ease-in-out infinite; animation-delay: 0.6s; }
      .wk-dot4 { animation: wk-dot-flash 0.9s ease-in-out infinite; animation-delay: 0.15s; }
      @keyframes wk-bob {
        0%,100% { transform: translateY(0) scaleY(1); }
        30%     { transform: translateY(-2px) scaleY(1.04); }
        60%     { transform: translateY(1px) scaleY(0.97); }
      }
      @keyframes wk-tap-r {
        from { transform: translateY(0); }
        to   { transform: translateY(-3px); }
      }
      @keyframes wk-tap-l {
        from { transform: translateY(-3px); }
        to   { transform: translateY(0); }
      }
      @keyframes working-shadow {
        0%,100% { transform: scaleX(1); opacity: 0.32; }
        50%     { transform: scaleX(0.9); opacity: 0.2; }
      }
      @keyframes wk-hat-shake {
        from { transform: rotate(-6deg) translateY(0); }
        to   { transform: rotate(4deg) translateY(-0.5px); }
      }
      @keyframes wk-dot-flash {
        0%,100% { opacity: 1; transform: scale(1); }
        50%     { opacity: 0.1; transform: scale(0.6); }
      }
    </style>
  
    <clipPath id="working-head-clip">
      <rect x="8" y="7" width="12" height="12" rx="6"/>
    </clipPath>
    <clipPath id="working-eye-clip">
      <circle cx="13" cy="12" r="1.35"/>
    </clipPath>
  </defs>

  <!-- 阴影 -->
  <ellipse class="pet-shadow" cx="10" cy="23.5" rx="7" ry="0.75" fill="#c0c0c0"/>

  <g class="wk-all pet-body">
    <!-- ── 绿色装饰光点（最底层，身体后面） ── -->
    <rect class="wk-dot1" x="4"  y="9"  width="1.2" height="1.2" rx="0.3" fill="#4AFF3D"/>
    <rect class="wk-dot2" x="21" y="4"  width="1.2" height="1.2" rx="0.3" fill="#4AFF3D"/>
    <rect class="wk-dot3" x="21" y="11" width="1.2" height="1.2" rx="0.3" fill="#4AFF3D"/>
    <rect class="wk-dot4" x="22" y="15" width="1.2" height="1.2" rx="0.3" fill="#4AFF3D"/>
    <rect class="wk-dot2" x="7"  y="5"  width="1"   height="1"   rx="0.2" fill="#4AFF3D"/>

    <!-- ── 角色身体（先画，笔记本后画覆盖下半身） ── -->
    <!-- 身体 -->
    <rect x="8" y="7" width="12" height="12" rx="6" fill="#f5f1e8"/>
    <!-- 帽子（随打字抖动） -->
    <g class="wk-hat">
      <g class="pet-hat" transform="translate(17.59 6.05) rotate(-108.9)"><path d="M-0.42 -0.30 C-1.91 -1.68 -3.98 -2.40 -5.02 -4.68 C-4.50 -1.80 -3.46 0.60 -2.15 0.72 C-1.39 0.72 -0.76 0.36 -0.42 -0.30 Z" fill="#c4123f"/><path d="M0.42 -0.30 C1.91 -1.68 3.98 -2.40 5.02 -4.68 C4.50 -1.80 3.46 0.60 2.15 0.72 C1.39 0.72 0.76 0.36 0.42 -0.30 Z" fill="#c4123f"/><path d="M-2.01 0.60 C-1.39 -3.30 1.39 -3.30 2.01 0.60 Z" fill="#c4123f"/><path d="M0 -6.12 C-1.04 -4.32 -1.18 -1.20 -0.69 0.60 L0.69 0.60 C1.18 -1.20 1.04 -4.32 0 -6.12 Z" fill="#c4123f"/><circle cx="-5.20" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="5.20" cy="-4.80" r="1.02" fill="#c4123f"/><circle cx="0" cy="-6.72" r="0.92" fill="#c4123f"/></g>
          <rect x="14" y="5" width="1" height="1" fill="#981033"/>
    </g>
    <!-- 眼睛 -->
    
    <g class="pet-eye" clip-path="url(#working-head-clip)">
      <g class="pet-pupil">
        <g class="pet-saccade">
          <g clip-path="url(#working-eye-clip)">
            <circle cx="13" cy="12" r="1.15" fill="#111827"/>
            <circle class="pet-shine" cx="12.62" cy="11.58" r="0.34" fill="#f5f1e8" opacity="0.9"/>
            <circle cx="13.42" cy="12.50" r="0.18" fill="#f5f1e8" opacity="0.35"/>
            <rect class="pet-lid" x="11.60" y="10.60" width="2.8" height="2.8" fill="#f5f1e8"/>
          </g>
          <!-- scar: just past the eye, and it rides with it -->
          <path d="M15.35 9.60 C15.85 10.90 15.80 13.10 15.30 14.40 C15.00 13.05 15.02 10.95 15.35 9.60 Z" fill="#c4123f"/>
          <path d="M15.00 10.55 L15.90 10.90" stroke="#981033" stroke-width="0.22" stroke-linecap="round" opacity="0.85"/>
          <path d="M15.00 13.20 L15.85 13.50" stroke="#981033" stroke-width="0.22" stroke-linecap="round" opacity="0.85"/>
        </g>
      </g>
    </g>

    <!-- ── 笔记本覆盖在身体下半部分上层 ── -->
    <!-- 屏幕面板 -->
    <rect x="3.5" y="15.5" width="10" height="6" rx="0.4" fill="#D9D9D9" stroke="#E5E7F0" stroke-width="0.5"/>
    <!-- 屏幕代码行 -->
    <rect x="4.5" y="17"   width="4" height="0.7" rx="0.25" fill="#9098b8" opacity="0.7"/>
    <rect x="4.5" y="18.5" width="6" height="0.7" rx="0.25" fill="#9098b8" opacity="0.5"/>
    <rect x="4.5" y="20"   width="3" height="0.7" rx="0.25" fill="#9098b8" opacity="0.6"/>
    <!-- 白色底条 -->
    <rect x="10" y="21" width="8" height="1" rx="0.2" fill="white"/>
    <!-- 键盘底座 -->
    <rect x="3" y="22" width="15" height="1" rx="0.3" fill="#D9D9D9"/>
    <!-- 触控板 -->
    <rect x="8" y="22.1" width="1" height="0.7" rx="0.2" fill="#736B6B" opacity="0.7"/>

    <!-- ── 两手在键盘上（笔记本上层，交替弹跳） ── -->
    <g class="wk-hand-l">
      <circle cx="7" cy="22" r="1.6" fill="#f5f1e8" fill-opacity="0.9"/>
    </g>
    <g class="wk-hand-r">
      <circle cx="14" cy="22" r="1.6" fill="#B9C3EB"/>
    </g>
  </g>
</svg>
