<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        position: relative;
      }
      #pet {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* ── the voice stage, said in words ──────────────────────────────────
         The pose already shows what is happening; this names it, so there is no
         guessing whether the pet is listening or thinking. Sits above the hat,
         inside the window, and disappears entirely when voice is off. */
      #stage {
        position: absolute;
        left: 50%;
        top: 2%;
        transform: translate(-50%, -6px);
        padding: 3px 10px 4px;
        border-radius: 999px;
        background: rgba(11, 13, 16, 0.86);
        border: 1px solid rgba(245, 241, 232, 0.12);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        color: #f5f1e8;
        font:
          600 11px/1.2 'Segoe UI',
          -apple-system,
          system-ui,
          sans-serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 160ms ease-out,
          transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      #stage.shown {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* A dot in the accent colour, so the label reads as live. */
      #stage::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--stage-accent, #c4123f);
        vertical-align: middle;
        animation: stage-pulse 1.5s ease-out infinite;
      }

      @keyframes stage-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #stage,
        #stage::before {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <object id="pet" type="image/svg+xml" data="../pet-states/idle.svg"></object>
    <div id="stage"></div>
    <script type="module" src="./petRenderer.ts"></script>
  </body>
</html>
