<!doctype html>
<html data-theme="light" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="The Fool" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="The Fool" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="icon" type="image/png" href="./pwa/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-180.png" />
    <title>The Fool</title>
    <script>
      /*
        crypto.randomUUID exists only in a secure context. Over HTTPS or on
        localhost it is there; reached from a phone at http://192.168.x.x it is
        not, and the first call throws during module evaluation. React never
        mounts, so WebUI on the local network is a black window with one console
        line — the exact thing remote access is for.

        crypto.getRandomValues carries no such restriction, so the identifiers
        stay cryptographically random. Classic (non-module) and inline so it is
        installed before the bundle is parsed.
      */
      (function () {
        if (typeof crypto === 'undefined' || typeof crypto.getRandomValues !== 'function') return;
        if (typeof crypto.randomUUID === 'function') return;

        crypto.randomUUID = function randomUUID() {
          var bytes = crypto.getRandomValues(new Uint8Array(16));
          // Version 4, variant 1, per RFC 4122.
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;

          var hex = [];
          for (var i = 0; i < bytes.length; i++) {
            hex.push((bytes[i] + 0x100).toString(16).slice(1));
          }

          return (
            hex.slice(0, 4).join('') +
            '-' +
            hex.slice(4, 6).join('') +
            '-' +
            hex.slice(6, 8).join('') +
            '-' +
            hex.slice(8, 10).join('') +
            '-' +
            hex.slice(10, 16).join('')
          );
        };
      })();
    </script>
    <script>
      // Synchronously restore theme appearance from localStorage to prevent theme flash
      (function () {
        try {
          var theme = localStorage.getItem('__fool_theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /*
        Boot splash — inline so it paints before the bundle loads.

        It reads as a presence waking up rather than a product logo: the
        character keeps juggling, the window breathes, and two rings travel
        outward the way a voice assistant shows it is attending to you. The
        earlier screen stacked an oversized mark under a block-character
        wordmark with no sign of progress, so any slow start read as a freeze.
      */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #0f1012;
        transition: opacity 260ms ease;
      }
      #boot-splash.boot-splash--leaving {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash__stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 220px;
        height: 220px;
      }
      /* The rings sit behind the character and are purely ambient. */
      .boot-splash__aura {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 1px solid #c4123f;
        opacity: 0;
        animation: boot-aura 3400ms ease-out infinite;
      }
      .boot-splash__aura--2 {
        animation-delay: 1700ms;
      }
      .boot-splash__juggler {
        position: relative;
        width: 150px;
        height: auto;
        animation:
          boot-juggler-in 620ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both,
          boot-breathe 3400ms ease-in-out 800ms infinite;
      }

      .boot-splash__wordmark {
        margin: 0;
        font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        font-size: 15px;
        font-weight: 500;
        /* The trailing space of the tracking would push the word off centre. */
        letter-spacing: 0.36em;
        text-indent: 0.36em;
        color: #ece9e3;
        animation: boot-fade-in 620ms ease-out 380ms both;
      }
      .boot-splash__status {
        margin: 0;
        font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        font-size: 12px;
        color: #7c7d82;
        animation: boot-fade-in 620ms ease-out 520ms both;
      }
      /*
        Indeterminate on purpose. The splash paints before the bundle, so it has
        no idea how far along startup is, and a bar that fills to a number it
        invented is worse than one that only says work is happening.
      */
      .boot-splash__progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.07);
      }
      .boot-splash__progress::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 32%;
        background: #c4123f;
        animation: boot-progress 1900ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-aura {
        from {
          transform: scale(0.55);
          opacity: 0.5;
        }
        to {
          transform: scale(1.4);
          opacity: 0;
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-progress {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(420%);
        }
      }
      @keyframes boot-fade-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes boot-juggler-in {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.9);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__aura,
        .boot-splash__juggler,
        .boot-splash__wordmark,
        .boot-splash__status,
        .boot-splash__progress::after {
          animation: none;
        }
        .boot-splash__progress::after {
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Set arco-theme on body synchronously
      try {
        var t = localStorage.getItem('__fool_theme');
        if (t) document.body.setAttribute('arco-theme', t);
      } catch (e) {}
    </script>
    <!--
      Boot splash. Lives in the document rather than in React so it paints on
      the first frame, before the bundle is parsed. `main.tsx` removes it once
      the app has mounted.
    -->
    <div id="boot-splash" role="status" aria-label="The Fool is starting">
      <div class="boot-splash__stage" aria-hidden="true">
        <div class="boot-splash__aura"></div>
        <div class="boot-splash__aura boot-splash__aura--2"></div>
        <img class="boot-splash__juggler" src="./boot/juggle.svg" alt="" />
      </div>
      <p class="boot-splash__wordmark" aria-hidden="true">THE FOOL</p>
      <p class="boot-splash__status" id="boot-splash-status" aria-hidden="true"></p>
      <div class="boot-splash__progress" aria-hidden="true"></div>
    </div>
    <script>
      // The status line is inline because the splash paints before the bundle,
      // and therefore before i18n, loads. It says only what is actually known
      // at this point — that startup is under way. Falls back to English.
      (function () {
        var STATUS = { en: 'Starting up', tr: 'Başlatılıyor' };

        var node = document.getElementById('boot-splash-status');
        if (!node) return;

        var lang = 'en';
        try {
          var stored = localStorage.getItem('__fool_language') || navigator.language || 'en';
          if (stored.toLowerCase().indexOf('tr') === 0) lang = 'tr';
        } catch (e) {}

        node.textContent = STATUS[lang] || STATUS.en;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
