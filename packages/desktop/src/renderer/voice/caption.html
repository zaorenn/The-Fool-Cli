<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Voice</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* The strip is never clickable; the window ignores the mouse as well. */
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        font-family:
          'Segoe UI',
          -apple-system,
          system-ui,
          sans-serif;
        /* Accent arrives with every stage event, straight from the app's theme,
           so a custom colour shows up here too. */
        --accent: #c4123f;
      }

      #card {
        width: 100%;
        border-radius: 18px;
        padding: 12px 18px 14px;
        background: rgba(11, 13, 16, 0.82);
        border: 1px solid rgba(245, 241, 232, 0.09);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.45),
          0 2px 6px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(14px);
        color: #f5f1e8;
        /* Rises from the edge of the screen on the way in, and sinks back on the
           way out — the strip belongs to the bottom of the display. */
        opacity: 0;
        transform: translateY(26px) scale(0.97);
        transition:
          opacity 200ms ease-out,
          transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      #card.shown {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      #head {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent);
        animation: pulse 1.6s ease-out infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
        }
        70% {
          box-shadow: 0 0 0 9px rgba(0, 0, 0, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }
      }

      #stage {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }

      #hint {
        font-size: 12px;
        color: rgba(245, 241, 232, 0.45);
        margin-left: auto;
      }

      /* The oscilloscope is drawn on canvas — see captionRenderer.ts. */
      #wave {
        display: block;
        width: 100%;
        height: 38px;
        margin-top: 6px;
      }

      #transcript {
        margin-top: 6px;
        font-size: 16px;
        line-height: 1.35;
        max-height: 44px;
        overflow: hidden;
        text-align: center;
        color: #f5f1e8;
      }

      #transcript:empty::before {
        content: attr(data-placeholder);
        color: rgba(245, 241, 232, 0.35);
      }

      @media (prefers-reduced-motion: reduce) {
        #dot {
          animation: none;
        }
        #card,
        #wave span {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="head">
        <span id="dot"></span>
        <span id="stage"></span>
        <span id="hint"></span>
      </div>
      <canvas id="wave"></canvas>
      <div id="transcript" data-placeholder=""></div>
    </div>
    <script type="module" src="./captionRenderer.ts"></script>
  </body>
</html>
