<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fool's Control</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* The notch is never clickable; the window ignores the mouse as well. */
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        font-family:
          'Segoe UI',
          -apple-system,
          system-ui,
          sans-serif;
        /* Accent arrives with every stage event, straight from the app's theme,
           so a custom colour shows up here too. */
        --accent: #c4123f;
      }

      /* The notch proper: flush to the top edge of the screen, square where it
         meets it and rounded where it leaves it, so it reads as part of the
         display rather than as a window floating near the top. */
      #notch {
        border-radius: 0 0 22px 22px;
        background: rgba(8, 9, 11, 0.92);
        border: 1px solid rgba(245, 241, 232, 0.08);
        border-top: none;
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(16px);
        color: #f5f1e8;
        overflow: hidden;
        /* Collapsed: just wide enough for the trace and the dot. */
        width: 190px;
        padding: 8px 16px 10px;
        /* Retracts into the edge on the way out, drops out of it on the way in. */
        opacity: 0;
        transform: translateY(-100%);
        transition:
          opacity 180ms ease-out,
          transform 320ms cubic-bezier(0.16, 1, 0.3, 1),
          width 340ms cubic-bezier(0.16, 1, 0.3, 1),
          padding 340ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      #notch.shown {
        opacity: 1;
        transform: translateY(0);
      }

      /* Gets out of the way of the pointer.

         The notch sits over the top of whatever is underneath it, and the one
         moment the user needs to see through it is the moment they move the
         cursor there — a tab strip, a menu bar, a close button. It cannot be
         clicked through to (the window ignores the mouse entirely), so hiding
         is the whole of the interaction: the pointer arrives, the notch fades
         out of the way, and what it was covering is usable again.

         Gone rather than faint. It was left at six percent so that it was
         clear the thing was still there and still listening — but the pointer
         arriving over the notch means the user wants to see what is *under* it,
         and a ghost of a dark pill over a tab strip is still something to read
         around. Nothing is hidden by this: the pill comes back the moment the
         cursor moves off, and the conversation it is reporting on is unaffected.

         Quick out and slower back, so it does not flicker while a cursor
         crosses it on the way somewhere else. The main process decides when
         this class is on — see `foolsControlWindow.ts`; the cursor is read from
         the system rather than from a mouse event, because the events stop
         arriving the moment the pointer leaves and this used to stick. */
      #notch.shown.under-pointer {
        opacity: 0;
        transition: opacity 110ms ease-out;
      }

      /* Expanded: room for the sentence and for what is being done about it. */
      #notch.wide {
        width: 560px;
        padding: 10px 20px 16px;
      }

      #head {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 26px;
      }

      #dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.6s ease-out infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
        }
        70% {
          box-shadow: 0 0 0 9px rgba(0, 0, 0, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }
      }

      /* The oscilloscope is drawn on canvas — see foolsControlRenderer.ts.
         Collapsed it is the whole of the notch, so it keeps its own row here
         rather than sitting behind text that is not shown yet. */
      #wave {
        flex: 1;
        display: block;
        height: 24px;
        min-width: 0;
      }

      #stage {
        flex: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
        transition:
          max-width 300ms ease,
          opacity 200ms ease;
      }

      #notch.wide #stage {
        max-width: 180px;
        opacity: 1;
      }

      #hint {
        flex: none;
        font-size: 11px;
        color: rgba(245, 241, 232, 0.4);
        white-space: nowrap;
        max-width: 0;
        overflow: hidden;
        opacity: 0;
        transition:
          max-width 300ms ease,
          opacity 200ms ease;
      }

      #notch.wide #hint {
        max-width: 200px;
        opacity: 1;
      }

      /* Everything below the head only exists in the expanded state. Collapsed it
         is clipped to nothing rather than hidden, so the notch can animate its
         height instead of jumping. */
      #body {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          max-height 340ms cubic-bezier(0.16, 1, 0.3, 1),
          opacity 220ms ease;
      }

      #notch.wide #body {
        max-height: 232px;
        opacity: 1;
      }

      #transcript {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.4;
        max-height: 44px;
        overflow: hidden;
        color: #f5f1e8;
      }

      #transcript:empty::before {
        content: attr(data-placeholder);
        color: rgba(245, 241, 232, 0.32);
      }

      /* What the agent is doing about it, newest last — the small chat window
         half of this surface. */
      /* The answer, in the accent so the two halves of the turn are never
         mistaken for one another: the question is plain, the reply is the app
         speaking. */
      #reply {
        margin-top: 8px;
        font-size: 14px;
        line-height: 1.4;
        max-height: 60px;
        overflow: hidden;
        color: var(--accent);
      }

      #reply:empty {
        display: none;
      }

      /* The agent's steps, oldest at the top.

         `flex-end` so that when there are more of them than there is room for,
         what falls off is the beginning and not the end. The list is a record of
         work still going on, and the line that answers "is it stuck?" is always
         the last one — clipping the bottom would hide the only one that matters. */
      #activity {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
        max-height: 132px;
        overflow: hidden;
      }

      .act {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 13px;
        line-height: 1.35;
        color: rgba(245, 241, 232, 0.72);
      }

      .act::before {
        content: '';
        flex: none;
        width: 5px;
        height: 5px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.75;
      }

      .act.done {
        color: rgba(245, 241, 232, 0.45);
      }

      .act.done::before {
        background: rgba(245, 241, 232, 0.35);
      }

      /* The question the agent is waiting on. Sits below everything else,
         because it is the newest thing to have happened and the eye is already
         travelling down the notch. */
      #notch:not(.asking) #ask {
        display: none;
      }

      #ask {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(245, 241, 232, 0.1);
      }

      #ask-title {
        font-size: 13px;
        line-height: 1.35;
        color: #f5f1e8;
        max-height: 36px;
        overflow: hidden;
      }

      #ask-options {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .opt {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 4px;
        border-radius: 8px;
        background: rgba(245, 241, 232, 0.07);
        font-size: 12px;
        line-height: 1.2;
        color: rgba(245, 241, 232, 0.86);
      }

      /* The number is the whole interface: it is what the user presses. */
      .optkey {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--accent);
        color: #0b0b0c;
        font-size: 11px;
        font-weight: 700;
      }

      /* An option past the numbered ones keeps the row alignment without
         pretending there is a key for it. */
      .opt.bare {
        padding-left: 10px;
      }

      #ask-hint {
        margin-top: 8px;
        font-size: 11px;
        color: rgba(245, 241, 232, 0.4);
      }

      /* A question needs the room the transcript was using. */
      #notch.asking #body {
        max-height: 260px;
      }

      @media (prefers-reduced-motion: reduce) {
        #dot {
          animation: none;
        }
        #notch,
        #body,
        #stage,
        #hint {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="notch">
      <div id="head">
        <span id="dot"></span>
        <canvas id="wave"></canvas>
        <span id="stage"></span>
        <span id="hint"></span>
      </div>
      <div id="body">
        <div id="transcript" data-placeholder=""></div>
        <div id="reply"></div>
        <div id="activity"></div>
        <div id="ask">
          <div id="ask-title"></div>
          <div id="ask-options"></div>
          <div id="ask-hint"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./foolsControlRenderer.ts"></script>
  </body>
</html>
