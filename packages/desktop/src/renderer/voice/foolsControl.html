<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fool's Control</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* The notch is never clickable; the window ignores the mouse as well. */
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        font-family:
          'Segoe UI',
          -apple-system,
          system-ui,
          sans-serif;
        /* Accent arrives with every stage event, straight from the app's theme,
           so a custom colour shows up here too. */
        --accent: #c4123f;
      }

      /* The notch proper: flush to the top edge of the screen, square where it
         meets it and rounded where it leaves it, so it reads as part of the
         display rather than as a window floating near the top. */
      #notch {
        border-radius: 0 0 22px 22px;
        background: rgba(8, 9, 11, 0.92);
        border: 1px solid rgba(245, 241, 232, 0.08);
        border-top: none;
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(16px);
        color: #f5f1e8;
        overflow: hidden;
        /* Collapsed: just wide enough for the trace and the dot. */
        width: 190px;
        padding: 8px 16px 10px;
        /* Retracts into the edge on the way out, drops out of it on the way in. */
        opacity: 0;
        transform: translateY(-100%);
        transition:
          opacity 180ms ease-out,
          transform 320ms cubic-bezier(0.16, 1, 0.3, 1),
          width 340ms cubic-bezier(0.16, 1, 0.3, 1),
          padding 340ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      #notch.shown {
        opacity: 1;
        transform: translateY(0);
      }

      /* Expanded: room for the sentence and for what is being done about it. */
      #notch.wide {
        width: 560px;
        padding: 10px 20px 16px;
      }

      #head {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 26px;
      }

      #dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.6s ease-out infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
        }
        70% {
          box-shadow: 0 0 0 9px rgba(0, 0, 0, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }
      }

      /* The oscilloscope is drawn on canvas — see foolsControlRenderer.ts.
         Collapsed it is the whole of the notch, so it keeps its own row here
         rather than sitting behind text that is not shown yet. */
      #wave {
        flex: 1;
        display: block;
        height: 24px;
        min-width: 0;
      }

      #stage {
        flex: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
        transition:
          max-width 300ms ease,
          opacity 200ms ease;
      }

      #notch.wide #stage {
        max-width: 180px;
        opacity: 1;
      }

      #hint {
        flex: none;
        font-size: 11px;
        color: rgba(245, 241, 232, 0.4);
        white-space: nowrap;
        max-width: 0;
        overflow: hidden;
        opacity: 0;
        transition:
          max-width 300ms ease,
          opacity 200ms ease;
      }

      #notch.wide #hint {
        max-width: 200px;
        opacity: 1;
      }

      /* Everything below the head only exists in the expanded state. Collapsed it
         is clipped to nothing rather than hidden, so the notch can animate its
         height instead of jumping. */
      #body {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          max-height 340ms cubic-bezier(0.16, 1, 0.3, 1),
          opacity 220ms ease;
      }

      #notch.wide #body {
        max-height: 190px;
        opacity: 1;
      }

      #transcript {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.4;
        max-height: 44px;
        overflow: hidden;
        color: #f5f1e8;
      }

      #transcript:empty::before {
        content: attr(data-placeholder);
        color: rgba(245, 241, 232, 0.32);
      }

      /* What the agent is doing about it, newest last — the small chat window
         half of this surface. */
      #activity {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 116px;
        overflow: hidden;
      }

      .act {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 13px;
        line-height: 1.35;
        color: rgba(245, 241, 232, 0.72);
      }

      .act::before {
        content: '';
        flex: none;
        width: 5px;
        height: 5px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.75;
      }

      .act.done {
        color: rgba(245, 241, 232, 0.45);
      }

      .act.done::before {
        background: rgba(245, 241, 232, 0.35);
      }

      @media (prefers-reduced-motion: reduce) {
        #dot {
          animation: none;
        }
        #notch,
        #body,
        #stage,
        #hint {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="notch">
      <div id="head">
        <span id="dot"></span>
        <canvas id="wave"></canvas>
        <span id="stage"></span>
        <span id="hint"></span>
      </div>
      <div id="body">
        <div id="transcript" data-placeholder=""></div>
        <div id="activity"></div>
      </div>
    </div>
    <script type="module" src="./foolsControlRenderer.ts"></script>
  </body>
</html>
