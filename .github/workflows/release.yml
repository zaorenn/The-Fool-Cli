# Release Pipeline for The Fool Application
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release'
        required: true
        default: '0.16.4'
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Bump Version
        run: |
          NEW_VERSION=${{ github.event.inputs.version }}

          # Update package.json
          bun run npm:version $NEW_VERSION

          # Update git tags and push
          git config user.name "Fool Release Bot"
          git config user.email "release@fool.ai"
          git add package.json packages/*/package.json 2>/dev/null || true
          git commit -m "chore: release $NEW_VERSION"
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin main --tags

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: bump-version

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Desktop Application
        run: bun run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fool-release
          path: packages/desktop/dist/

  release-github:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: The Fool v${{ github.event.inputs.version }}
          body: |
            ## Release Notes for The Fool v${{ github.event.inputs.version }}

            ### Features
            - Enhanced voice assistant capabilities
            - Improved STT/TTS latency optimization
            - Better code generation accuracy

            ### Improvements
            - Faster startup time
            - Reduced memory footprint
            - Better error recovery

            ### Bug Fixes
            - Fixed various stability issues
            - Improved crash recovery

      - name: Upload Desktop App
        uses: softprops/action-gh-release@v1
        with:
          files: packages/desktop/dist/*

  notify-team:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: release-github

    steps:
      - name: Slack Notification
        run: |
          # Notify slack channel about release
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-Type: application/json' \
          #   --data '{"text": "🚀 The Fool v'"$VERSION"' released!"}'
          echo "Release notification sent"
